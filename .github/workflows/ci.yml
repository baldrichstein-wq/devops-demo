name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  ARTIFACT_NAME: app-paket

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pip-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Dependencies installieren
        run: python -m pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -v

      - name: Paket bauen
        run: |
          mkdir -p build
          python -m zipfile -c "build/${{ env.ARTIFACT_NAME }}.zip" src/

      - name: Paket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Paket herunterladen
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/

      - name: Zugangsdaten prüfen
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Token-Länge: ${#DEPLOY_TOKEN}"

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            --title "Version 1.0.${{ github.run_number }}" \
            --notes "Automatisches Deployment aus GitHub Actions" \
            build/*.zip
